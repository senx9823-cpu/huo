<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>联动福利</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%;font-family:'Microsoft YaHei','PingFang SC',sans-serif;overflow-x:hidden;background:#000}

/* ---------- 主容器 ---------- */
.container{
  position:relative;z-index:1;width:100%;max-width:420px;
  margin:0 auto;min-height:100vh;background:#000;
}

/* ---------- 海报区域 ---------- */
.hero-banner{
  width:100%;position:relative;
}
.hero-banner img{
  width:100%;display:block;
}

/* ---------- 呼吸动画 ---------- */
@keyframes breathe{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}
.breathe-anim{
  animation:breathe 1.5s ease-in-out infinite;
}

/* ---------- 滚动通知条（胶囊气泡横滚） ---------- */
.notify-bar{
  position:absolute;
  left:0;right:0;
  bottom:60px;
  z-index:10;
  overflow:hidden;
  height:30px;
}
.notify-track{
  display:flex;
  white-space:nowrap;
  animation:marquee-scroll 30s linear infinite;
  height:30px;
  align-items:center;
  gap:8px;
}
.notify-track .bubble{
  display:inline-flex;
  align-items:center;
  height:26px;
  padding:0 10px;
  border-radius:13px;
  font-size:11px;
  color:#fff;
  font-weight:600;
  letter-spacing:.3px;
  white-space:nowrap;
  background:rgba(0,0,0,.7);
  flex-shrink:0;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}
@keyframes marquee-scroll{
  0%{transform:translateX(0)}
  100%{transform:translateX(-50%)}
}

/* ---------- 输入提示图片 ---------- */
.input-hint-img{
  text-align:left;
  padding:10px 18px 2px 8px;
  position:relative;z-index:3;
  left:17px;top:3px;   /* ?adjust 固化：第一步提示位置 */
  pointer-events:none;   /* 提示图不拦截点击，保证下方输入框可点可输入 */
}
.input-hint-img img{
  width:50%;
  display:block;
}
.input-hint-img.hidden{
  display:none;
}

/* ---------- 输入区域 ---------- */
.input-section{
  padding:4px 18px 8px;
  position:relative;z-index:4;   /* 高于提示图，确保输入框在上层可聚焦 */
}
.input-wrap{
  background:#fff;
  border-radius:28px;
  padding:0 18px 0 12px;
  display:flex;align-items:center;gap:10px;
  height:54px;
  border:none;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.input-wrap:focus-within{
  box-shadow:0 2px 12px rgba(122,106,255,.25);
  border:1.5px solid #8888ff;
}
.input-wrap .icon{
  width:24px;height:24px;flex-shrink:0;object-fit:contain;
}
.input-wrap input{
  flex:1;border:none;outline:none;
  font-size:18px;color:#333;font-weight:500;letter-spacing:2px;
  background:transparent;height:100%;
}
.input-wrap input::placeholder{color:#bbb;font-size:17px;letter-spacing:2px}

/* ---------- 验证码输入框 ---------- */
.verify-section{
  padding:4px 18px 8px;
  position:relative;z-index:5;   /* 高于手机号输入框，保证第二步提示图不被遮挡 */
  display:none;
}
.verify-section.show{display:block}
.verify-step-img{
  position:absolute;
  right:-42px;
  top:-35px;
  z-index:5;   /* ?adjust 固化：第二步提示位置 */
  pointer-events:none;   /* 提示图不拦截点击，保证下方验证码输入框/按钮可点 */
}
.verify-step-img img{
  width:240px;
  display:block;
}
.verify-wrap{
  background:#fff;
  border-radius:28px;
  padding:0 4px 0 12px;
  display:flex;align-items:center;gap:10px;
  height:54px;
  border:none;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}
.verify-wrap:focus-within{
  box-shadow:0 2px 12px rgba(122,106,255,.25);
  border:1.5px solid #8888ff;
}
.verify-wrap .icon{
  width:24px;height:24px;flex-shrink:0;
  font-size:22px;line-height:24px;text-align:center;
}
.verify-wrap input{
  flex:1;border:none;outline:none;
  font-size:18px;color:#333;font-weight:500;letter-spacing:2px;
  background:transparent;height:100%;
}
.verify-wrap input::placeholder{color:#bbb;font-size:17px;letter-spacing:2px}
.verify-code-btn{
  flex-shrink:0;
  height:36px;
  padding:0 12px;
  border-radius:18px;
  background:linear-gradient(135deg,#ff9a3c,#f57604);
  color:#fff;font-size:13px;font-weight:700;
  border:none;cursor:pointer;
  letter-spacing:1px;
  white-space:nowrap;
  box-shadow:0 2px 6px rgba(245,118,4,.3);
  transform:translate(-22px,-1px);   /* ?adjust 固化：获取验证码按钮左移 */
}
.verify-code-btn:disabled{
  background:#555;color:#aaa;cursor:not-allowed;
  box-shadow:none;
}

/* ---------- 协议 ---------- */
.agree-section{
  padding:4px 20px 8px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  position:relative;z-index:3;
  transform:translateY(4px);   /* ?adjust 固化：协议下移 */
}
.agree-section input[type="checkbox"]{
  width:18px;height:18px;
  accent-color:#7a6aff;flex-shrink:0;
}
.agree-section label{
  font-size:14px;color:rgba(220,210,240,.7);line-height:1.6;
  font-weight:500;
}
.agree-section label .hl{
  color:#f5a623;font-weight:600;
}

/* ---------- 立即领取按钮（火花.png 直接使用，可 ?adjust 微调） ---------- */
.claim-btn-section{
  padding:0 18px 24px;
  position:relative;z-index:3;
}
.claim-btn-crop{
  width:90%;
  margin:-6px auto 0;
  transform:translate(-6px,-198px);   /* ?adjust 固化：领取按钮上移 */
}
.claim-btn-crop img{
  width:100%;
  display:block;
  cursor:pointer;
  transition:transform .15s;
}
.claim-btn-crop img:active{transform:scale(.96)}
.claim-btn-crop img.breathe-anim{
  animation:breathe 1.5s ease-in-out infinite;
}

/* ---------- Loading（火影忍者风格：查克拉读条 + 旋转手里剑） ---------- */
.loading-overlay{
  position:fixed;inset:0;
  background:radial-gradient(circle at 50% 42%,#1c1002 0%,#000 72%);
  z-index:100;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:24px;
}
.loading-overlay.active{display:flex}
.loading-progress{
  position:relative;
  width:260px;height:22px;
  background:#2a1a05;
  border:3px solid #121212;
  box-shadow:inset 0 0 0 2px #7a4416, 0 4px 0 rgba(0,0,0,.5), 0 0 18px rgba(245,118,4,.25);
}
.loading-progress-bar{
  position:relative;
  height:100%;width:0%;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.15) 0 14px, rgba(255,255,255,0) 14px 28px),
    linear-gradient(90deg,#f57604,#ff9a3c 60%,#ffc36b);
  box-shadow:inset 0 5px 0 rgba(255,255,255,.28), inset 0 -5px 0 rgba(0,0,0,.28), 0 0 12px rgba(255,154,60,.55);
  transition:width .5s ease;
  animation:chakra-flow 1s linear infinite;
}
@keyframes chakra-flow{
  from{background-position:0 0, 0 0;}
  to{background-position:28px 0, 0 0;}
}
/* 骑在读条尖端旋转的手里剑 */
.loading-shuriken{
  position:absolute;
  right:-22px;top:-32px;
  width:32px;height:32px;
  filter:drop-shadow(2px 2px 0 rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(255,154,60,.5));
  animation:shuriken-ride .6s linear infinite;
}
@keyframes shuriken-ride{
  0%{transform:translateY(0) rotate(0deg);}
  50%{transform:translateY(-4px) rotate(180deg);}
  100%{transform:translateY(0) rotate(360deg);}
}
.loading-text{color:#ffb347;font-size:16px;letter-spacing:2px;text-align:center;min-height:40px;font-weight:700;text-shadow:2px 2px 0 #7a3b00,0 0 12px rgba(255,154,60,.45)}
.loading-step{opacity:.5;font-size:13px;margin-top:4px;animation:pulse 1.5s ease-in-out infinite;color:rgba(255,179,71,.55);font-weight:600;text-shadow:2px 2px 0 #7a3b00}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* ---------- 成功弹窗 ---------- */
.modal-overlay{
  position:fixed;inset:0;background:#000;z-index:200;
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.active{display:flex}
.modal{
  position:relative;
  width:320px;
  aspect-ratio:1703/2461;   /* 弹窗比例由底图脚本按火影边框.JPG真实尺寸自动设置 */
  border-radius:16px;
  overflow:hidden;
  margin-top:20px;
  animation:modal-in .4s ease-out;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}
/* 底图：绝对定位铺满卡片，不变形（卡片比例=图片比例） */
.modal-bg{
  position:absolute;
  top:0;left:0;
  width:100%;
  height:100%;
}
/* 内容层：铺满卡片，内部元素全部绝对定位（默认居中，可用 ?adjust 拖动微调） */
.modal-body{
  position:absolute;
  inset:0;
}
.modal-body > *{
  position:absolute;
  margin:0;
  text-align:center;
}
/* 默认位置（百分比，均居中；?adjust 调完会被替换） */
.modal .check{left:41.5%;top:9%;width:17%;height:auto;display:block;animation:check-pop .5s ease-out;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
.modal h2{left:10%;top:27%;width:80%;font-size:24px;color:#ffd54f;letter-spacing:3px;font-weight:900;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.modal p{left:10%;top:37%;width:80%;font-size:15px;color:#e6e3f7;line-height:2;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.6)}
@keyframes modal-in{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes check-pop{0%{transform:scale(0)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
/* ===== 奖励条（整条图片，自带奖励图标） ===== */
.reward-row{
  left:11.7%;top:12.2%;width:78%;
}
.reward-row img{
  width:100%;
  height:auto;
  display:block;
  border-radius:10px;
}
.redeem-code{
  left:14.1%;top:66.6%;width:62%;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:13px;color:#f0eefc;font-weight:600;
  white-space:nowrap;
}
.redeem-code .code{
  position:relative;
  font-family:Consolas,'Courier New',monospace;
  font-size:17px;font-weight:900;color:#ffe14d;letter-spacing:2px;
  background:rgba(255,255,255,.1);
  border:1.5px dashed rgba(255,255,255,.55);
  border-radius:10px;padding:5px 12px;
  white-space:nowrap;
  /* 炸弹炸开出场特效 */
  animation:code-bomb .7s cubic-bezier(.2,.8,.3,1) .35s both;
}
/* 爆炸金光 */
.redeem-code .code::before{
  content:'';position:absolute;inset:-2px;border-radius:12px;
  background:radial-gradient(circle,rgba(255,225,77,.6),rgba(255,225,77,0) 70%);
  pointer-events:none;
  animation:code-flash .65s ease-out .35s both;
}
/* 冲击波圆环 */
.redeem-code .code::after{
  content:'';position:absolute;inset:0;border-radius:10px;
  border:2px solid rgba(255,225,77,.9);
  pointer-events:none;
  animation:code-shock .7s ease-out .35s both;
}
@keyframes code-bomb{
  0%{transform:scale(.15);opacity:0;filter:blur(4px)}
  40%{transform:scale(1.3);opacity:1;filter:blur(0)}
  55%{transform:scale(.9)}
  70%{transform:scale(1.07)}
  85%{transform:scale(.98)}
  100%{transform:scale(1)}
}
@keyframes code-flash{
  0%{opacity:0;transform:scale(.4)}
  25%{opacity:1}
  100%{opacity:0;transform:scale(1.9)}
}
@keyframes code-shock{
  0%{transform:scale(.6);opacity:0}
  20%{opacity:1}
  100%{transform:scale(2.3);opacity:0}
}
.copy-btn{
  position:relative;
  border:1px solid rgba(255,255,255,.55);background:transparent;
  color:#fff;font-size:11px;font-weight:600;
  padding:4px 8px;border-radius:12px;cursor:pointer;letter-spacing:1px;
  white-space:nowrap;
  transition:all .2s;
}
.copy-btn:hover{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.8)}
.copy-toast{
  position:fixed;top:50%;left:50%;z-index:300;
  transform:translate(-50%,-50%) scale(.85);
  background:rgba(0,0,0,.72);color:#fff;
  font-size:14px;font-weight:600;letter-spacing:1px;
  padding:14px 30px;border-radius:28px;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 20px rgba(0,0,0,.35);
  white-space:nowrap;opacity:0;pointer-events:none;
  transition:all .3s ease;
}
.copy-toast .tick{
  width:18px;height:18px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#ffd54f,#ffb300);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#4a3010;font-weight:900;
}
.copy-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal-btn{
  left:20.1%;top:76.6%;width:60%;height:44px;
  font-size:16px;font-weight:700;color:#fff;
  cursor:pointer;letter-spacing:3px;position:absolute;border:none;
  background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.4);
  border-radius:24px;
  transition:all .2s;
}
.modal-btn:hover{background:rgba(255,255,255,.2)}

/* ---------- 抖动 ---------- */
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.shake{animation:shake .4s ease-in-out}
</style>
</head>
<body>

<div class="container">

  <!-- 海报 + 举报按钮 + 通知条 -->
  <div class="hero-banner">
    <img src="火影海报.png" alt="联动活动海报">
    <!-- 滚动通知条 -->
    <div class="notify-bar" id="notifyBar">
      <div class="notify-track" id="notifyTrack"></div>
    </div>
  </div>

  <!-- 输入提示图片 -->
  <div class="input-hint-img breathe-anim" id="phoneHintImg">
    <img src="输入手机号.png" alt="输入手机号">
  </div>

  <!-- 手机号输入 -->
  <div class="input-section">
    <div class="input-wrap" id="phoneWrap">
      <img class="icon" src="屏幕截图 2026-06-23 172222.png" alt="电话">
      <input type="tel" id="phoneInput" placeholder="请输入您的手机号码" maxlength="11" inputmode="numeric">
    </div>
  </div>

  <!-- 验证码输入（动态显示） -->
  <div class="verify-section" id="verifySection">
    <div class="verify-step-img breathe-anim">
      <img src="第二步.png" alt="第2步">
    </div>
    <div class="verify-wrap" id="verifyWrap">
      <span class="icon">✉</span>
      <input type="text" id="verifyInput" placeholder="请输入短信验证码" maxlength="6" inputmode="numeric">
      <button class="verify-code-btn" id="verifyCodeBtn" onclick="sendVerifyCode()">获取验证码</button>
    </div>
  </div>

  <!-- 协议 -->
  <div class="agree-section">
    <input type="checkbox" id="agree" checked>
    <label for="agree">我已阅读并同意<span class="hl">《协议》《抽奖具有概率性》</span></label>
  </div>

  <!-- 立即领取按钮 -->
  <div class="claim-btn-section">
    <div class="claim-btn-crop">
      <img class="breathe-anim" src="火花.png" alt="立即获取" onclick="handleClaim()">
    </div>
  </div>

</div>

<!-- 复制成功提示 -->
<div class="copy-toast" id="copyToast"><span class="tick">&#10003;</span>复制成功</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-progress"><div class="loading-progress-bar" id="progressBar"><svg class="loading-shuriken" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1 L20.5 11.5 L31 16 L20.5 20.5 L16 31 L11.5 20.5 L1 16 L11.5 11.5 Z" fill="#5c5c5c" stroke="#141414" stroke-width="1.4" stroke-linejoin="round"/><circle cx="16" cy="16" r="3.4" fill="#141414"/><circle cx="16" cy="16" r="1.3" fill="#8a8a8a"/></svg></div></div>
  <div class="loading-text">
    <div id="loadingMain">正在为您匹配专属福利...</div>
    <div class="loading-step" id="loadingStep">步骤 1/3</div>
  </div>
</div>

<!-- 成功弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <img class="modal-bg" src="火影边框.JPG" alt="">
    <div class="modal-body">
      <img class="check" src="火影按钮修正版.png" alt="成功">
      <h2>恭喜中奖</h2>
      <p>火影忍者绑定兑换码已发送<br>请进游戏内兑换</p>
      <div class="reward-row">
        <img src="火影奖励.png" alt="奖励">
      </div>
      <div class="redeem-code">兑换码为<span class="code" id="codeText">A7***9D4</span><button class="copy-btn" onclick="copyCode()">复制</button></div>
      <button class="modal-btn" onclick="closeModal()">我知道了</button>
    </div>
  </div>
</div>

<script>
/* ========== 滚动通知条（胶囊气泡横滚 marquee） ========== */
(function(){
  var track=document.getElementById('notifyTrack');
  function randomMsg(){
    var prefix=['152','138','159','177','150','139','158','186','135','188'];
    var p=prefix[Math.floor(Math.random()*prefix.length)];
    var suffix=String(Math.floor(Math.random()*9000)+1000);
    return '用户'+p+'****'+suffix+'抢到了';
  }
  var html='';
  for(var i=0;i<10;i++){
    html+='<span class="bubble">'+randomMsg()+'</span>';
  }
  track.innerHTML=html+html;
})();

/* ========== 手机号输入 → 显示验证码框 ========== */
(function(){
  var phoneInput=document.getElementById('phoneInput');
  var verifySection=document.getElementById('verifySection');

  var phoneHint=document.getElementById('phoneHintImg');
  phoneInput.addEventListener('focus',function(){
    phoneHint.classList.add('hidden');
  });
  phoneInput.addEventListener('blur',function(){
    if(!this.value.trim())phoneHint.classList.remove('hidden');
  });
  phoneInput.addEventListener('input',function(){
    var val=this.value.trim();
    if(val.length===11){
      verifySection.classList.add('show');
      phoneHint.classList.add('hidden');
    }else{
      verifySection.classList.remove('show');
      if(!this.value.trim())phoneHint.classList.remove('hidden');
    }
  });
})();

/* ========== 获取验证码 ========== */
var verifyTimer=null;
function sendVerifyCode(){
  var btn=document.getElementById('verifyCodeBtn');
  if(btn.disabled)return;
  btn.disabled=true;
  var seconds=60;
  btn.textContent=seconds+'s';
  verifyTimer=setInterval(function(){
    seconds--;
    btn.textContent=seconds+'s';
    if(seconds<=0){
      clearInterval(verifyTimer);
      btn.disabled=false;
      btn.textContent='获取验证码';
    }
  },1000);
}

/* ========== 领取处理 ========== */
function handleClaim(){
  var phone=document.getElementById('phoneInput').value.trim();
  if(!phone||phone.length<11){
    document.getElementById('phoneWrap').classList.add('shake');
    setTimeout(function(){document.getElementById('phoneWrap').classList.remove('shake')},500);
    return;
  }
  
  var verifySection=document.getElementById('verifySection');
  if(verifySection.classList.contains('show')){
    var code=document.getElementById('verifyInput').value.trim();
    if(!code||code.length<4){
      document.getElementById('verifyInput').parentElement.classList.add('shake');
      setTimeout(function(){document.getElementById('verifyInput').parentElement.classList.remove('shake')},500);
      return;
    }
  }

  if(!document.getElementById('agree').checked){alert('请先同意相关协议');return;}

  var overlay=document.getElementById('loadingOverlay');
  var progressBar=document.getElementById('progressBar');
  var mainText=document.getElementById('loadingMain');
  overlay.classList.add('active');progressBar.style.width='0%';

  var steps=[
    {text:'正在为您匹配专属福利...',progress:33},
    {text:'正在校验领取资格...',progress:66},
    {text:'正在发放奖励...',progress:100}
  ];
  var stepIndex=0;
  var interval=setInterval(function(){
    if(stepIndex<steps.length){
      mainText.textContent=steps[stepIndex].text;
      document.getElementById('loadingStep').textContent='步骤 '+stepIndex+'/3';
      progressBar.style.width=steps[stepIndex].progress+'%';stepIndex++;
    }
  },800);

  setTimeout(function(){clearInterval(interval);progressBar.style.width='100%';mainText.textContent='领取成功！';document.getElementById('loadingStep').textContent='';},2500);
  setTimeout(function(){overlay.classList.remove('active');document.getElementById('modalOverlay').classList.add('active');},3000);
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('active');}

/* ========== 兑换码复制 ========== */
function copyCode(){
  var code=document.getElementById('codeText').textContent.trim();
  var toast=document.getElementById('copyToast');
  function showOk(){
    toast.classList.add('show');
    setTimeout(function(){toast.classList.remove('show')},1500);
  }
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=code;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);showOk();
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(showOk).catch(fallback);
  }else{fallback();}
}

/* ========== 兑换码小爆炸粒子（弹窗出现时从文本中心炸开） ========== */
(function(){
  if(/[?&#]adjust/.test(location.href))return;
  var overlay=document.getElementById('modalOverlay');
  var code=document.getElementById('codeText');
  if(!overlay||!code)return;
  var fired=false;

  function burst(){
    var rect=code.getBoundingClientRect();
    var cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    var colors=['#ffe14d','#ffd54f','#fff6c2','#ffb300','#ffffff'];
    for(var i=0;i<14;i++){
      (function(i){
        var p=document.createElement('span');
        var ang=(Math.PI*2*i)/14+Math.random()*.6;
        var dist=45+Math.random()*55;
        var size=3+Math.random()*4;
        var color=colors[i%colors.length];
        p.style.cssText='position:fixed;left:'+cx+'px;top:'+cy+'px;width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+color+';box-shadow:0 0 6px '+color+';pointer-events:none;z-index:250;transform:translate(-50%,-50%);';
        document.body.appendChild(p);
        var tx=Math.cos(ang)*dist, ty=Math.sin(ang)*dist;
        function kill(){if(p.parentNode)p.parentNode.removeChild(p)}
        if(p.animate){
          var a=p.animate([
            {transform:'translate(-50%,-50%) scale(1)',opacity:1},
            {transform:'translate(calc(-50% + '+tx+'px),calc(-50% + '+ty+'px)) scale(0)',opacity:0}
          ],{duration:600+Math.random()*350,easing:'cubic-bezier(.15,.7,.3,1)'});
          a.onfinish=kill;
        }else{
          setTimeout(kill,900);
        }
      })(i);
    }
  }

  var obs=new MutationObserver(function(){
    if(overlay.classList.contains('active')&&!fired){
      fired=true;
      setTimeout(burst,350);   /* 与 code-bomb 的 delay 对齐 */
      setTimeout(function(){fired=false},1400);
    }
  });
  obs.observe(overlay,{attributes:true,attributeFilter:['class']});
})();

/* ========== 弹窗卡片比例 = 底图真实比例（保证像素边框完整不变形） ========== */
(function(){
  var bg=document.querySelector('.modal-bg');
  var modal=document.querySelector('.modal');
  if(!bg||!modal)return;
  function set(){
    if(bg.naturalWidth&&bg.naturalHeight){
      modal.style.aspectRatio=bg.naturalWidth+'/'+bg.naturalHeight;
    }
  }
  if(bg.complete)set();else bg.addEventListener('load',set);
})();

/* ========== 弹窗元素可视化调整模式：网址后加 ?adjust 开启，调完复制参数发回即可 ========== */
(function(){
  if(!/[?&#]adjust/.test(location.href))return;
  var modal=document.querySelector('.modal');
  var overlay=document.getElementById('modalOverlay');
  if(!modal||!overlay)return;

  /* 第一页默认把验证码框显示出来，方便调整位置 */
  var verifySection=document.getElementById('verifySection');
  if(verifySection)verifySection.style.display='block';

  function q(s){return modal.querySelector(s)}
  var items=[
    /* 第二页：弹窗内部（已按 ?adjust 固化） */
    {name:'打勾图',  el:q('.modal .check'), left:41.5, top:9,  width:17, font:0, page:2},
    {name:'标题',    el:q('.modal h2'),     left:10,   top:27, width:80, font:24, page:2},
    {name:'文案',    el:q('.modal p'),      left:10,   top:37, width:80, font:15, page:2},
    {name:'奖励条',  el:q('.reward-row'),   left:11.7, top:12.2,width:78, font:0, page:2},
    {name:'兑换码行',el:q('.redeem-code'),  left:14.1, top:66.6,width:62, font:0, page:2},
    {name:'按钮',    el:q('.modal-btn'),    left:20.1, top:76.6,width:60, font:0, page:2},
    /* 第一页：主页面元素（均可拖动 / 滚轮微调） */
    {name:'第一步提示',  el:document.getElementById('phoneHintImg'),      tx:0,  ty:0,   z:95, page:1},
    {name:'手机号框',    el:document.getElementById('phoneWrap'),         tx:0,  ty:0,   page:1},
    {name:'第二步提示',  el:document.querySelector('.verify-step-img'),   tx:0,  ty:0,   page:1},
    {name:'验证码框',    el:verifySection,                               tx:0,  ty:0,   page:1},
    {name:'获取验证码按钮',el:document.getElementById('verifyCodeBtn'),   tx:-22, ty:-1,  page:1},
    {name:'协议',        el:document.querySelector('.agree-section'),    tx:0,  ty:4,   page:1},
    {name:'领取按钮',    el:document.querySelector('.claim-btn-crop'),   tx:-6, ty:-198, page:1}
  ].filter(function(it){return it.el});

  /* 左上角：第一页 / 第二页 切换 */
  var pageToggle=document.createElement('div');
  pageToggle.style.cssText='position:fixed;top:10px;left:10px;z-index:1000;display:flex;gap:8px;';
  pageToggle.innerHTML='<button id="pg1" style="padding:6px 14px;border:none;border-radius:8px;background:#888;color:#fff;font-weight:bold;cursor:pointer;font-size:13px">第一页</button><button id="pg2" style="padding:6px 14px;border:none;border-radius:8px;background:#ffd54f;color:#4a3010;font-weight:bold;cursor:pointer;font-size:13px">第二页</button>';
  document.body.appendChild(pageToggle);

  /* 说明 + 复制参数面板（顶部居中，可收起，默认只显示小药丸） */
  var panel=document.createElement('div');
  panel.style.cssText='position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:999;background:rgba(0,0,0,.88);color:#fff;border-radius:10px;font-size:11px;line-height:1.7;font-family:Consolas,monospace;text-align:left;max-width:82vw;overflow:hidden;';
  panel.innerHTML='<div id="adjHead" style="padding:6px 12px;cursor:pointer;font-weight:bold;font-family:Microsoft YaHei;display:flex;align-items:center;gap:6px"><span>参数</span><span id="adjArrow" style="font-size:10px">▾</span></div>'+
    '<div id="adjBody" style="padding:0 12px 10px;display:none">'+
    '<div style="margin-bottom:4px;font-family:Microsoft YaHei">拖动=移动 · 滚轮=缩放（标题/文案滚轮改字号）<br>拖回原处即重置 · 左上角切换第一/第二页</div>'+
    '<pre id="adjInfo" style="margin:0 0 8px;white-space:pre-wrap"></pre><button id="adjCopy" style="padding:4px 12px;border:none;border-radius:6px;background:#ffd54f;color:#4a3010;font-weight:bold;cursor:pointer;font-size:12px">复制参数</button></div>';
  document.body.appendChild(panel);
  var info=document.getElementById('adjInfo');
  document.getElementById('adjHead').addEventListener('click',function(){
    var body=document.getElementById('adjBody'),arrow=document.getElementById('adjArrow');
    var open=body.style.display!=='none';
    body.style.display=open?'none':'block';
    arrow.textContent=open?'▸':'▾';
  });

  function showPage(p){
    if(p===2){overlay.classList.add('active');}
    else{overlay.classList.remove('active');}
    var b1=document.getElementById('pg1'),b2=document.getElementById('pg2');
    b1.style.background=p===1?'#ffd54f':'#888';b1.style.color=p===1?'#4a3010':'#fff';
    b2.style.background=p===2?'#ffd54f':'#888';b2.style.color=p===2?'#4a3010':'#fff';
    /* 非当前页元素禁用指针事件，避免两层互相遮挡拖动 */
    items.forEach(function(it){it.el.style.pointerEvents=(it.page===p)?'auto':'none';});
  }
  document.getElementById('pg1').addEventListener('click',function(){showPage(1)});
  document.getElementById('pg2').addEventListener('click',function(){showPage(2)});

  function dump(it){
    if(it.page===2){
      var t=it.name+': left:'+it.left+'%; top:'+it.top+'%;';
      if(it.font)t+=' font-size:'+it.font+'px;';
      if(it.width!=null)t+=' width:'+it.width+'%';
      return t;
    }
    return it.name+': translate('+(it.tx||0)+'px,'+(it.ty||0)+'px)';
  }

  function apply(){
    items.forEach(function(it){
      var s=it.el.style;
      if(it.page===2){
        s.position='absolute';
        s.left=it.left+'%';
        s.top=it.top+'%';
        s.margin='0';
        s.textAlign='center';
        if(it.width!=null)s.width=it.width+'%';
        if(it.font)s.fontSize=it.font+'px';
      }else{
        s.transform='translate('+(it.tx||0)+'px,'+(it.ty||0)+'px)';
        s.zIndex=it.z||80;   /* 提升层级，避免被相邻元素压住抓不到 */
      }
      s.animation='none';   /* 关掉呼吸动画，避免覆盖拖拽的 transform */
      s.cursor='move';
      s.touchAction='none';
    });
    info.textContent=items.map(dump).join('\n')+
      '\n弹窗: aspect-ratio:'+(modal.style.aspectRatio||'auto')+'; width:'+(modal.style.width||'320px');
  }
  apply();
  showPage(2);  /* 默认打开第二页（弹窗） */

  items.forEach(function(it){
    var sx,sy,ol,ot,drag=false;
    it.el.addEventListener('pointerdown',function(e){
      drag=true;sx=e.clientX;sy=e.clientY;
      if(it.page===2){ol=it.left;ot=it.top;}else{ol=it.tx;ot=it.ty;}
      try{it.el.setPointerCapture(e.pointerId)}catch(err){}
      e.preventDefault();e.stopPropagation();
    });
    it.el.addEventListener('pointermove',function(e){
      if(!drag)return;
      if(it.page===2){
        var w=modal.offsetWidth||1,h=modal.offsetHeight||1;
        it.left=Math.round((ol+(e.clientX-sx)/w*100)*10)/10;
        it.top=Math.round((ot+(e.clientY-sy)/h*100)*10)/10;
      }else{
        it.tx=Math.round(ol+(e.clientX-sx));
        it.ty=Math.round(ot+(e.clientY-sy));
      }
      apply();
    });
    it.el.addEventListener('pointerup',function(){drag=false});
    it.el.addEventListener('wheel',function(e){
      e.preventDefault();e.stopPropagation();
      if(it.page===2){
        if(it.font){it.font=Math.max(10,Math.min(40,Math.round(it.font+(e.deltaY<0?2:-2))));}
        else{it.width=Math.max(8,Math.min(110,Math.round(it.width+(e.deltaY<0?2:-2))));}
      }else{
        it.ty=Math.max(-400,Math.min(400,Math.round(it.ty+(e.deltaY<0?-4:4))));
      }
      apply();
    },{passive:false});
  });

  document.getElementById('adjCopy').addEventListener('click',function(){
    var btn=this;
    var txt=items.map(dump).join('\n')+
      '\n弹窗: aspect-ratio:'+(modal.style.aspectRatio||'auto')+'; width:'+(modal.style.width||'320px');
    function done(){btn.textContent='已复制';setTimeout(function(){btn.textContent='复制参数'},1200);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done);
    }else{
      var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);done();
    }
  });
})();
</script>
